[project]
name = "taxi-lts"
version = "0.1.0"
description = "Robust taxi-fare anomaly detection with least trimmed squares regression"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "nbformat>=5.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "pdf2image>=1.17",
    "pdfplumber>=0.11",
    "pyarrow>=17.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "robpy==0.0.6",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_lts"]

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = [
    "ignore::pandas.errors.Pandas4Warning:statsmodels.*",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"report/create_training_eda_report.py" = ["E501"]
